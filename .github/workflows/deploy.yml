name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test backend
        working-directory: backend
        run: go test ./...

      - name: Build binary Linux
        working-directory: backend
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o server .

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Copy binary + dist lên VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "backend/server,frontend/dist"
          target: /tmp/goshop-deploy

      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e
            mv /tmp/goshop-deploy/backend/server /var/www/go-shop/server.new
            chmod +x /var/www/go-shop/server.new
            mv -f /var/www/go-shop/server.new /var/www/go-shop/server
            rm -rf /var/www/go-shop/dist
            mv /tmp/goshop-deploy/frontend/dist /var/www/go-shop/dist
            rm -rf /tmp/goshop-deploy
            systemctl restart go-shop
            sleep 2
            curl -fs http://127.0.0.1:8080/api/health

      # ---------- 5. Thông báo Telegram ----------

      - name: Telegram — deploy thành công
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode=Markdown \
            --data-urlencode text="✅ *go-shop deploy THÀNH CÔNG*
          👤 ${{ github.actor }}
          📝 ${{ github.event.head_commit.message }}
          🔗 https://linkup.io.vn"

      - name: Telegram — deploy thất bại
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="❌ go-shop deploy THẤT BẠI!
          👤 ${{ github.actor }}
          📝 ${{ github.event.head_commit.message }}
          🔍 Xem log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
