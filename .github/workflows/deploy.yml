name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build backend
        run: |
          cd backend
          go mod download
          go build -o server .

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "backend/server,backend/.env,backend/schema.sql,frontend/dist"
          target: "/var/www/go-shop"
          strip_components: 0

      - name: Restart service
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /var/www/go-shop/backend/uploads
            cp -r /var/www/go-shop/frontend/dist/* /var/www/go-shop/frontend/ 2>/dev/null || true
            sudo systemctl daemon-reload
            sudo systemctl restart go-shop
            sleep 2
            curl -sf http://localhost:8080/api/health && echo "✅ Deploy OK" || echo "❌ Deploy failed"

      - name: Telegram notification
        if: always()
        uses: appleboy/telegram-action@v1.2.0
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ${{ job.status == 'success' && '✅' || '❌' }} Deploy ${{ job.status }}
            Repo: ${{ github.repository }}
            Commit: ${{ github.sha }}
            Message: ${{ github.event.head_commit.message }}
